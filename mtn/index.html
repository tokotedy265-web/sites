<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paiement MTN MoMo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
</head>
<body class="platform-mtn">
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">
    <div class="card">
      <h1>MTN Mobile Money <span class="badge">Local</span></h1>
      <p class="sub">Saisis ton numéro MTN et choisis le plan.</p>

      <form class="form" id="mtn-form">
        <div class="row">
          <select id="plan">
            <option value="week">Semaine (7 jours)</option>
            <option value="month">Mois (30 jours)</option>
          </select>
          <input class="input" id="tgid" placeholder="Votre Telegram ID (tg_id)" />
        </div>

        <input class="input" id="phone" placeholder="Numéro MTN (ex: 670000000)" required>
        <label class="price" id="price"></label>
        <button class="button" type="submit">Payer avec MTN MoMo</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const planEl = document.getElementById("plan");
    const priceEl = document.getElementById("price");
    const form = document.getElementById("mtn-form");
    const statusEl = document.getElementById("status");

    function updatePrice(){ priceEl.textContent = formatPrice(planEl.value); }
    updatePrice();
    planEl.addEventListener("change", updatePrice);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const tg_id = document.getElementById("tgid").value;
      const phone = document.getElementById("phone").value;

      const payload = await buildPaymentPayload({
        provider:"mtn",
        plan: planEl.value,
        tg_id
      });

      payload.phone = phone;

      try{
        setStatus(statusEl, "Création du paiement…");
        const r = await createPayment(payload);
        sessionStorage.setItem("external_id", r.external_id);
        setStatus(statusEl, "Demande envoyée. Valide sur ton téléphone.");
      }catch(err){
        setStatus(statusEl, "Erreur: " + err.message);
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const tg_id = urlParams.get("tg_id");
    if (tg_id) document.getElementById("tgid").value = tg_id;
  </script>
</body>
</html>
