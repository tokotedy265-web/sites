<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paiement PayPal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>

  <!-- Telegram Login Widget -->
  <script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="LeslyAC_bot"
        data-size="large"
        data-userpic="false"
        data-request-access="write"
        data-auth-url="/auth">
  </script>
</head>

<body class="platform-paypal">
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">
    <div class="card">
      <h1>PayPal <span class="badge">International</span></h1>
      <p class="sub">Choisis ton plan et procède au paiement PayPal.</p>

      <form class="form" id="paypal-form">
        <div class="row">
          <select id="plan">
            <option value="week">Semaine (7 jours)</option>
            <option value="month">Mois (30 jours)</option>
          </select>

          <!-- AUTO-FILL Telegram ID -->
          <input class="input" id="tgid" placeholder="Votre Telegram ID" readonly />
        </div>

        <label class="price" id="price"></label>

        <button class="button" type="submit">Payer avec PayPal</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    /* --- Auto-fill Telegram ID from Telegram Login Widget --- */
    window.addEventListener("message", function(event) {
      if (event.data && event.data.tg_id) {
        document.getElementById("tgid").value = event.data.tg_id;
      }
    });

    /* --- Price update --- */
    const planEl = document.getElementById("plan");
    const priceEl = document.getElementById("price");
    const form = document.getElementById("paypal-form");
    const statusEl = document.getElementById("status");

    function updatePrice(){ priceEl.textContent = formatPrice(planEl.value); }
    updatePrice();
    planEl.addEventListener("change", updatePrice);

    /* --- Submit payment --- */
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const tg_id = document.getElementById("tgid").value;

      const payload = await buildPaymentPayload({
        provider:"paypal",
        plan: planEl.value,
        tg_id
      });

      try{
        setStatus(statusEl, "Création du paiement PayPal…");
        const r = await createPayment(payload);

        // Redirection PayPal
        if (r.paypal_url) {
          window.location.href = r.paypal_url;
        } else {
          setStatus(statusEl, "Lien PayPal introuvable.");
        }

      }catch(err){
        setStatus(statusEl, "Erreur: " + err.message);
      }
    });
  </script>
</body>
</html>
