<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paiement Visa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
</head>
<body class="platform-visa">
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">
    <div class="card">
      <h1>Carte Visa <span class="badge">International</span></h1>
      <p class="sub">Tu seras redirigé(e) vers une page de paiement sécurisée.</p>

      <form class="form" id="visa-form">
        <div class="row">
          <select id="plan">
            <option value="week">Semaine (7 jours)</option>
            <option value="month">Mois (30 jours)</option>
          </select>
          <input class="input" id="tgid" placeholder="Votre Telegram ID (tg_id)" />
        </div>

        <label class="price" id="price"></label>
        <button class="button" type="submit">Payer avec Visa</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const planEl = document.getElementById("plan");
    const priceEl = document.getElementById("price");
    const form = document.getElementById("visa-form");
    const statusEl = document.getElementById("status");

    function updatePrice(){ priceEl.textContent = formatPrice(planEl.value); }
    updatePrice();
    planEl.addEventListener("change", updatePrice);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const tg_id = document.getElementById("tgid").value;

      const payload = await buildPaymentPayload({
        provider:"visa",
        plan: planEl.value,
        tg_id
      });

      try{
        setStatus(statusEl, "Création du paiement…");
        const r = await createPayment(payload);

        if (r.redirect_url){
          setStatus(statusEl, "Redirection vers la page de paiement…");
          window.location.href = r.redirect_url;
        } else {
          setStatus(statusEl, "Erreur: lien de paiement indisponible.");
        }

      }catch(err){
        setStatus(statusEl, "Erreur: " + err.message);
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const tg_id = urlParams.get("tg_id");
    if (tg_id) document.getElementById("tgid").value = tg_id;
  </script>
</body>
</html>
